name: Build libreoffice-file-converter

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      - name: Lint
        run: bun run lint
        shell: bash

      - name: Format check
        run: bun run format:check
        shell: bash

      - name: Build package
        run: bun run build
        shell: bash
