name: Setup LibreOffice Darwin
description: Setups LibreOffice on Darwin

runs:
  using: composite
  steps:
    - name: Setup Homebrew
      uses: Homebrew/actions/setup-homebrew@main

    - name: Install LibreOffice
      run: brew install --cask libreoffice
      shell: bash

    - name: Print LibreOffice version
      run: soffice --version
      shell: bash
